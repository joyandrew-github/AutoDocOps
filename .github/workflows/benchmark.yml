name: Benchmark Pipeline

on:
  schedule:
    - cron: "0 3 * * 1"  # Weekly Monday 3am UTC
  workflow_dispatch:
    inputs:
      sizes:
        description: "Repository sizes to benchmark (space-separated)"
        default: "small"
        type: string
      categories:
        description: "Categories to benchmark (space-separated, or 'all')"
        default: "all"
        type: string

env:
  PYTHON_VERSION: "3.12"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: autodocops
          POSTGRES_PASSWORD: bench_password
          POSTGRES_DB: autodocops_bench
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/bench_password
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p bench_password 'RETURN 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Start backend
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_USER: autodocops
          POSTGRES_PASSWORD: bench_password
          POSTGRES_DB: autodocops_bench
          REDIS_HOST: localhost
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: bench_password
          SECRET_KEY: benchmark-secret-key
          ENVIRONMENT: testing
        run: |
          cd backend
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 10
          curl -s http://localhost:8000/api/v1/health || echo "Backend may not be ready"

      - name: Run framework tests
        run: |
          cd benchmarks
          python -m pytest tests/ -v --tb=short

      - name: Run benchmarks
        env:
          BENCHMARK_API_URL: http://localhost:8000
          BENCHMARK_OUTPUT_DIR: benchmarks/results
        run: |
          SIZES="${{ inputs.sizes || 'small' }}"
          CATS="${{ inputs.categories || 'all' }}"
          CMD="python -m benchmarks run --sizes $SIZES --output benchmarks/results"
          if [ "$CATS" != "all" ]; then
            CMD="$CMD --categories $CATS"
          fi
          $CMD || true

      - name: Generate comparison report
        run: python -m benchmarks compare --last 5 --output benchmarks/results || true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmarks/results/
          retention-days: 90

      - name: Check for regressions
        run: |
          if [ -f benchmarks/results/regression_report.md ]; then
            echo "## Regression Report" >> $GITHUB_STEP_SUMMARY
            cat benchmarks/results/regression_report.md >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f benchmarks/results/regression_report.md ] && grep -q "Critical" benchmarks/results/regression_report.md; then
            echo "::error::Critical performance regressions detected!"
            exit 1
          fi

      - name: Post benchmark summary
        if: always()
        run: |
          if [ -f benchmarks/results/latest.json ]; then
            echo "## Benchmark Summary" >> $GITHUB_STEP_SUMMARY
            python -c "
import json
d = json.load(open('benchmarks/results/latest.json'))
s = d['summary']
print(f'| Metric | Value |')
print(f'|--------|-------|')
print(f'| Run ID | \`{d[\"run_id\"]}\` |')
print(f'| Total | {s[\"total\"]} |')
print(f'| Passed | {s[\"passed\"]} |')
print(f'| Failed | {s[\"failed\"]} |')
print(f'| Errors | {s[\"errors\"]} |')
print(f'| Pass Rate | {s[\"pass_rate\"]}% |')
print(f'| Duration | {d[\"duration_seconds\"]:.1f}s |')
            " >> $GITHUB_STEP_SUMMARY
          fi
