version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: autodocops-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autodocops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autodocops_password}
      POSTGRES_DB: ${POSTGRES_DB:-autodocops}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autodocops}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autodocops
    deploy:
      resources:
        limits:
          memory: 1G

  neo4j:
    image: neo4j:5.15-community
    container_name: autodocops-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j_password}
      NEO4J_dbms_memory_pagecache_size: 1G
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autodocops
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: autodocops-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autodocops

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autodocops-backend
    environment:
      ENVIRONMENT: production
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-autodocops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autodocops_password}
      POSTGRES_DB: ${POSTGRES_DB:-autodocops}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
      PROMETHEUS_ENABLED: "true"
      LOG_LEVEL: INFO
      RATE_LIMIT_PER_MINUTE: 120
    ports:
      - "8000:8000"
    volumes:
      - backend_logs:/app/logs
      - repo_workspace:/tmp/autodocops/repos
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - autodocops
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autodocops-celery-worker
    environment:
      ENVIRONMENT: production
      POSTGRES_SERVER: postgres
      POSTGRES_USER: ${POSTGRES_USER:-autodocops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autodocops_password}
      POSTGRES_DB: ${POSTGRES_DB:-autodocops}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j_password}
      REDIS_HOST: redis
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - autodocops
    restart: unless-stopped
    command: celery -A app.core.celery_app:celery_app worker --loglevel=info --concurrency=4 -Q default,pipeline,analysis

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autodocops-celery-beat
    environment:
      ENVIRONMENT: production
      REDIS_HOST: redis
      POSTGRES_SERVER: postgres
      POSTGRES_USER: ${POSTGRES_USER:-autodocops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autodocops_password}
      POSTGRES_DB: ${POSTGRES_DB:-autodocops}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - autodocops
    restart: unless-stopped
    command: celery -A app.core.celery_app:celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autodocops-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - autodocops
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.49.0
    container_name: autodocops-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - autodocops
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.3.0
    container_name: autodocops-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - autodocops
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.92.0
    container_name: autodocops-otel-collector
    volumes:
      - ./infra/otel/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - autodocops
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
  backend_logs:
  repo_workspace:
  prometheus_data:
  grafana_data:

networks:
  autodocops:
    driver: bridge
