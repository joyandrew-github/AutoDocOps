version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: autodocops-postgres
    environment:
      POSTGRES_USER: autodocops
      POSTGRES_PASSWORD: autodocops_password
      POSTGRES_DB: autodocops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autodocops -d autodocops"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autodocops-network

  neo4j:
    image: neo4j:5.15-community
    container_name: autodocops-neo4j
    environment:
      NEO4J_AUTH: neo4j/neo4j_password
      NEO4J_dbms_memory_pagecache_size: 1G
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autodocops-network

  redis:
    image: redis:7-alpine
    container_name: autodocops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autodocops-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autodocops-backend
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: autodocops
      POSTGRES_PASSWORD: autodocops_password
      POSTGRES_DB: autodocops
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REPOSITORY_WORKSPACE: /tmp/autodocops/repos
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
      - repo_workspace:/tmp/autodocops/repos
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - autodocops-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autodocops-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - autodocops-network
    command: npm run dev

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  backend_logs:
  repo_workspace:

networks:
  autodocops-network:
    driver: bridge
