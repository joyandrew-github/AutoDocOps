apiVersion: v1
kind: Secret
metadata:
  name: autodocops-secrets
  labels:
    {{- include "autodocops.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  NEO4J_PASSWORD: {{ .Values.secrets.neo4jPassword | quote }}
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
