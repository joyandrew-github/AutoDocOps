apiVersion: apps/v1
kind: Deployment
metadata:
  name: autodocops-celery-worker
  namespace: autodocops
  labels:
    app: autodocops-celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autodocops-celery-worker
  template:
    metadata:
      labels:
        app: autodocops-celery-worker
    spec:
      containers:
        - name: worker
          image: autodocops/backend:latest
          command: ["celery", "-A", "app.core.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=4", "-Q", "default,pipeline,analysis"]
          envFrom:
            - configMapRef:
                name: autodocops-config
            - secretRef:
                name: autodocops-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
