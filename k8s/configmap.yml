apiVersion: v1
kind: ConfigMap
metadata:
  name: autodocops-config
  namespace: autodocops
data:
  ENVIRONMENT: "production"
  POSTGRES_SERVER: "postgres-svc"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "autodocops"
  NEO4J_URI: "bolt://neo4j-svc:7687"
  NEO4J_USER: "neo4j"
  REDIS_HOST: "redis-svc"
  REDIS_PORT: "6379"
  LOG_LEVEL: "INFO"
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_ENDPOINT: "http://otel-collector-svc:4317"
  PROMETHEUS_ENABLED: "true"
  RATE_LIMIT_PER_MINUTE: "120"
